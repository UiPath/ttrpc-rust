name: Sanity Check
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

jobs:
  commits_check_job:
    runs-on: uipath-ubuntu-latest
    name: Commits Check
    steps:
    - name: Get PR Commits
      id: 'get-pr-commits'
      uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d  # master
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Commit Body Check
      uses: tim-actions/commit-body-check@214d2f0c6be4ac1d0e3bb659896e49f05030ca20  # master
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}
    - name: DCO Check
      uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21  # master
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}
  pr_wip_check:
    runs-on: uipath-ubuntu-latest
    name: WIP Check
    steps:
    - name: WIP Check
      uses: tim-actions/wip-check@8c84f5987215d49440b86475062d61e4f099e1b7  # master
      with:
        labels: '["do-not-merge", "wip", "rfc"]'
        keywords: '["WIP", "wip", "RFC", "rfc"]'
